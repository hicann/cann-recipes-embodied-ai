  "dists-pytorch",
  "einx",
  "fastparquet",
  "flask",
  "flopth",
  "ftfy",
  "futureproof",
  "fvcore",
  "glfw",
  "h5py",
  "imagecodecs",
  "ipycanvas",
  "ipyevents",
  "jupyter-compare-view",
  "jupyterlab",
  "kornia",
  "lerobot",
  "lpips",
  "lz4",
  "matplotlib",
  "mediapy",
  "more-itertools",
  "moviepy",
  "multi-storage-client[boto3,google-cloud-storage,fsspec,observability-otel,vault]==0.44.0",
  "ninja",
