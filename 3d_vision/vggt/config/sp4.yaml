model_args:
  ckpt: "ckpt/model.pt"
  images-path: "examples/kitchen/images"
  enable-profiling: false
  profile-dir: "prof_sp"
  num-runs: 6

optimization:
  computation-redundancy-elimination:
    rope-cache: true
    dpt-pos-embed-cache: true
    cos-sin-dtype-optimization: true

  parallel-computation:
    enable: true
    ulysses-degree: 2
    ring-degree: 2

  quantization:
    dtype: "bf16"
    int8-w8a8:
      enable: false
      build: false

  memory-and-data-format:
    conv-weight-layout-preconvert: true

model_name: "vggt"
world_size: 4
master_port: 29600
entry_script: "demo_infer.py"